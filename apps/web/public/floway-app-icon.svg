    <rect x="86" y="216" width="72" height="12" rx="6"/>
    <rect x="326" y="150" width="132" height="16" rx="8"/>
    <rect x="340" y="184" width="102" height="14" rx="7"/>
    <rect x="354" y="216" width="72" height="12" rx="6"/>
  </g>
  <g fill="#f8efd8">

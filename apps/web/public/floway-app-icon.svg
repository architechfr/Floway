<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Floway</title>
  <desc id="desc">Icône Floway vert nuit, orange et crème</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#173a30"/>
      <stop offset="0.55" stop-color="#081711"/>
      <stop offset="1" stop-color="#030805"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" x2="1">

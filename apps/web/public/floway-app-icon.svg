      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#1b4b39" stroke-width="3" opacity=".7"/>
